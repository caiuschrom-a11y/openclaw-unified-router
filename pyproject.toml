[project]
name = "unified-router"
version = "0.1.0"
description = "Unified Stripe checkout + webhook router for the openclaw-products catalog. One FastAPI app handles billing for all 30+ paid products."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "stripe>=11.0.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
